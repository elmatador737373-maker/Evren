<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2d31;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            color: #f2f3f5;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #b5bac1;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #1e1f22;
            background-color: #1e1f22;
            color: #dbdee1;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: 1px solid #5865f2;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752c4;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .success { background-color: #23a55a; color: white; }
        .error { background-color: #f23f43; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Discord Webhook Sender</h2>
    
    <div class="form-group">
        <label for="webhookUrl">URL Webhook Discord *</label>
        <input type="text" id="webhookUrl" value="https://discord.com/api/webhooks/1539231889523736656/-BesVMh3we1UPveU2aLXcZBj4fgKNwjT_uXOgYI9OgvsxE3pfPny59Wpqikjo5kfzvcO" required>
    </div>

    <div class="form-group">
        <label for="username">Nome Utente da Replicare</label>
        <input type="text" id="username" placeholder="Es. Mario Rossi (lascia vuoto per default)">
    </div>

    <div class="form-group">
        <label for="avatarUrl">URL Immagine Profilo (PFP)</label>
        <input type="url" id="avatarUrl" placeholder="https://link-immagine.com/foto.png">
    </div>

    <div class="form-group">
        <label for="message">Messaggio *</label>
        <textarea id="message" placeholder="Scrivi il messaggio qui..." required></textarea>
    </div>

    <button onclick="sendWebhook()">Invia Messaggio</button>

    <div id="status"></div>
</div>

<script>
async function sendWebhook() {
    const webhookUrl = document.getElementById('webhookUrl').value.trim();
    const username = document.getElementById('username').value.trim();
    const avatarUrl = document.getElementById('avatarUrl').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!webhookUrl || !message) {
        showStatus('Per favore compila l\'URL del webhook e il messaggio.', 'error');
        return;
    }

    const payload = {
        content: message
    };

    if (username !== "") payload.username = username;
    if (avatarUrl !== "") payload.avatar_url = avatarUrl;

    try {
        const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        });

        if (response.ok || response.status === 204) {
            showStatus('Messaggio inviato con successo!', 'success');
            document.getElementById('message').value = '';
        } else {
            const errorData = await response.json();
            showStatus(`Errore nell'invio: ${errorData.message || 'Verifica il link del webhook'}`, 'error');
        }
    } catch (error) {
        showStatus('Errore di rete o URL non valido.', 'error');
    }
}

function showStatus(msg, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.textContent = msg;
    statusDiv.className = type;
    statusDiv.style.display = 'block';
}
</script>

</body>
</html>
